services:
  # #231 (N-3): the do_notifications:deliver command, wiring together the
  # queue backend (N-1/N-2), the email/digest renderers (N-4/N-8), and the
  # log_mailer message_notify plugin (N-1). See
  # src/Drush/Commands/DoNotificationsCommands.php's class docblock for the
  # full drain/group/deliver contract.
  do_notifications.deliver_commands:
    class: Drupal\do_notifications\Drush\Commands\DoNotificationsCommands
    arguments:
      - '@do_notifications.queue'
      - '@do_notifications.email_renderer'
      - '@do_notifications.digest_renderer'
      - '@plugin.message_notify.notifier.manager'
      - '@entity_type.manager'
      - '@logger.channel.do_notifications'
    tags:
      - { name: drush.command }

  # #234 (N-6): the daily digest worker (`drush do_notifications:digest-daily`).
  # This file is Drush's own CLI-command-discovery mechanism
  # (\Drush\Runtime\LegacyServiceFinder / LegacyServiceInstantiator) — it is
  # REQUIRED for `drush do_notifications:digest-daily` to be found on the
  # command line, because DrupalBoot8::bootstrap() only collects
  # 'drush.command'-tagged services from files discovered this way (see
  # that class's `taggedServices('drush.command')` call), never from a tag
  # scan of Drupal's own container.
  #
  # The SAME class is ALSO registered as `do_notifications.digest_command`
  # in `do_notifications.services.yml` — required so `\Drupal::service(
  # 'do_notifications.digest_command')` resolves (this is how
  # DailyDigestCommandTest invokes it directly, with no drush process
  # boundary, and how any future non-CLI caller would too).
  # LegacyServiceInstantiator constructs its own separate instance from
  # THIS file purely for CLI dispatch; the two instances are stateless
  # (identical constructor deps, no shared mutable state) so this is a
  # harmless quirk of Drush's legacy discovery mechanism, not a functional
  # duplication.
  do_notifications.digest_command:
    class: Drupal\do_notifications\Commands\DigestCommands
    arguments:
      - '@do_notifications.queue'
      - '@do_notifications.digest_queue'
      - '@do_notifications.digest_renderer'
      - '@entity_type.manager'
      - '@state'
      - '@datetime.time'
    tags:
      - { name: 'drush.command' }
