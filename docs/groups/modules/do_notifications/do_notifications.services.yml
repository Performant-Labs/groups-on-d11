services:
  do_notifications.hooks:
    class: Drupal\do_notifications\Hook\DoNotificationsHooks
    autowire: false
    arguments:
      - '@entity_type.manager'
      - '@queue'
    tags:
      - { name: 'hook_implementations' }
  do_notifications.queue:
    class: Drupal\do_notifications\Queue\DatabaseQueueBackend
    arguments: ['@database', '@datetime.time']
    # N-1 (#229) completed — DatabaseQueueBackend is now the default;
    # MockQueueBackend remains in the codebase for unit tests.

  # #233 (N-5): resolves a recipient's (frequency, send_at) pair per uid --
  # see src/Frequency/FrequencyResolver.php's class docblock.
  do_notifications.frequency_resolver:
    class: Drupal\do_notifications\Frequency\FrequencyResolver
    arguments:
      - '@entity_type.manager'
      - '@datetime.time'
      - '@config.factory'

  do_notifications.subscription_router:
    class: Drupal\do_notifications\Subscription\SubscriptionRouter
    arguments:
      - '@entity_type.manager'
      - '@flag'
      - '@do_notifications.queue'
      - '@datetime.time'
      - '@state'
      - '@do_notifications.frequency_resolver'

  # #232 (N-4): renders an activity_* Message into a subject/body_text/
  # body_html email payload. See src/Email/EmailRenderer.php's class
  # docblock for the rendering pipeline (token substitution + (removed)
  # semantics + the HTML/text dual render path).
  do_notifications.email_renderer:
    class: Drupal\do_notifications\Email\EmailRenderer
    autowire: false
    arguments:
      - '@token'
      - '@renderer'
      - '@entity_type.manager'
      - '@twig'
      - '@extension.list.module'
      - '@date.formatter'

  do_notifications.email_hooks:
    class: Drupal\do_notifications\Hook\DoNotificationsEmailHooks
    autowire: false
    tags:
      - { name: 'hook_implementations' }

  # #236 (N-8): wraps N do_notifications.email_renderer fragments into one
  # digest payload for a recipient + window ("daily"|"weekly"). See
  # src/Email/DigestRenderer.php's class docblock for the aggregation/
  # grouping/cap pipeline.
  do_notifications.digest_renderer:
    class: Drupal\do_notifications\Email\DigestRenderer
    autowire: false
    arguments:
      - '@do_notifications.email_renderer'
      - '@twig'
      - '@extension.list.module'
      - '@date.formatter'

  # #234 (N-6): persists aggregated, per-recipient digest email payloads
  # into the `do_notifications_digest_queue` table (see
  # `do_notifications.install`), populated by DigestCommands::digestDaily()
  # and — later — N-3's delivery worker. See
  # src/Queue/DigestQueueBackendInterface.php's class docblock for why this
  # is a separate contract from `do_notifications.queue`.
  do_notifications.digest_queue:
    class: Drupal\do_notifications\Queue\DatabaseDigestQueueBackend
    arguments: ['@database', '@datetime.time']

  # #234 (N-6): the daily digest worker's command class. Registered HERE
  # (Drupal's own container), not only in `drush.services.yml`, because
  # Drush's `drush.services.yml` mechanism instantiates services into a
  # SEPARATE, Drush-internal registry
  # (\Drush\Runtime\LegacyServiceInstantiator::$instantiatedDrushServices)
  # that is never merged into \Drupal::getContainer() — confirmed by
  # reading vendor/drush/drush/src/Runtime/LegacyServiceInstantiator.php: a
  # service registered ONLY in drush.services.yml cannot be resolved via
  # `\Drupal::service()`, which is exactly how DailyDigestCommandTest (and
  # any future non-CLI caller) looks the command up. Registering it here
  # makes it a normal, container-resolvable service; `drush.services.yml`
  # separately tags it `drush.command` so `drush
  # do_notifications:digest-daily` also works from the CLI (Drush's
  # LegacyServiceInstantiator constructs its own short-lived instance for
  # that dispatch path only — a harmless artifact of the legacy mechanism,
  # not a functional duplication, since the two instances are stateless and
  # only one is ever invoked per process).
  do_notifications.digest_command:
    class: Drupal\do_notifications\Commands\DigestCommands
    arguments:
      - '@do_notifications.queue'
      - '@do_notifications.digest_queue'
      - '@do_notifications.digest_renderer'
      - '@entity_type.manager'
      - '@state'
      - '@datetime.time'

  # #232 (N-4): the [message:uid] / [message:field_group_id] /
  # [message:field_referenced_entity_type] /
  # [message:field_referenced_entity_id] token provider the activity_*
  # Message templates' stored text depends on — see
  # src/Hook/DoNotificationsTokensHooks.php's class docblock for why this is
  # needed (the contrib Token module is not installed, and message.tokens.inc
  # only resolves its one `author` BC token).
  do_notifications.tokens_hooks:
    class: Drupal\do_notifications\Hook\DoNotificationsTokensHooks
    autowire: false
    arguments:
      - '@entity_type.manager'
    tags:
      - { name: 'hook_implementations' }

  # #229 (N-1): the logger channel Drupal\do_notifications\Plugin\Notifier\
  # LogMailer writes each delivery to (watchdog `type` = `do_notifications`).
  # Mirrors message_notify's own `logger.channel.message_notify` entry.
  logger.channel.do_notifications:
    parent: logger.channel_base
    arguments: ['do_notifications']

  # #231 (N-3): the do_notifications:deliver Drush command's own logic,
  # registered here (NOT just drush.services.yml) so it resolves via
  # Drupal's OWN service container (`\Drupal::service()`), not only via
  # Drush's own separate, one-way-read LegacyServiceInstantiator object
  # graph (see vendor/drush/drush/src/Runtime/LegacyServiceInstantiator.php
  # — it instantiates drush.services.yml classes into its OWN internal
  # array, never registers them back into the Drupal container). This
  # kernel test suite (and any other real container consumer) needs the
  # normal container lookup to work; drush.services.yml (also present, same
  # class + arguments) remains the mechanism Drush's own CLI bootstrap uses
  # to discover and wire the command for `drush do_notifications:deliver`.
  #
  # The 5th argument is an OPTIONAL reference ('@?', not '@') deliberately:
  # message_notify IS a hard .info.yml dependency of do_notifications (so
  # this is always resolvable on a real site), but several of this module's
  # OWN kernel test suites (DatabaseQueueBackendTest, DigestRendererTest,
  # EmailRendererTest) enable do_notifications WITHOUT enabling
  # message_notify, to keep their fixtures minimal. A hard '@' reference
  # here would fail EVERY one of those suites' container compilation
  # (Symfony validates every registered service's references at compile
  # time, whether or not the service is ever instantiated) — not just this
  # command's own test. See
  # src/Drush/Commands/DoNotificationsCommands.php's class docblock
  # "OPTIONAL `$notifierManager`" for the corresponding nullable
  # constructor parameter + runtime fail-fast guard.
  do_notifications.deliver_commands:
    class: Drupal\do_notifications\Drush\Commands\DoNotificationsCommands
    autowire: false
    arguments:
      - '@do_notifications.queue'
      - '@do_notifications.email_renderer'
      - '@do_notifications.digest_renderer'
      - '@?plugin.message_notify.notifier.manager'
      - '@entity_type.manager'
      - '@logger.channel.do_notifications'
